databaseChangeLog:
  - changeSet:
      id: 7-create-group-courses
      author: voldemar
      changes:
        - createTable:
            tableName: group_courses
            columns:
              - column:
                  name: group_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: bigint
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: group_courses
            columnNames: group_id, course_id
            constraintName: pk_group_courses

        - addForeignKeyConstraint:
            baseTableName: group_courses
            baseColumnNames: group_id
            constraintName: fk_group_courses_group
            referencedTableName: groups
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: group_courses
            baseColumnNames: course_id
            constraintName: fk_group_courses-course
            referencedTableName: courses
            referencedColumnNames: id
            onDelete: CASCADE