databaseChangeLog:
  - changeSet:
      id: 7-create-group-courses
      author: voldemar
      changes:
        - createTable:
            tableName: group_courses
            columns:
              - column:
                  name: group_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_group_courses_group
                    referencedTableName: groups
                    referencedColumnName: id
                    onDelete: CASCADE
              - column:
                  name: course_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_group_courses_course
                    referencedTableName: courses
                    referencedColumnName: id
                    onDelete: CASCADE
        - addPrimaryKey:
            tableName: group_courses
            columnNames: group_id, course_id
            constraintName: pk_group_courses

