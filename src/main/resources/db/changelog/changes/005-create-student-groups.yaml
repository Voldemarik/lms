databaseChangeLog:
  - changeSet:
      id: 5-create-student-groups
      author: voldemar
      changes:
        - createTable:
            tableName: student_groups
            columns:
              - column:
                  name: student_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: group_id
                  type: bigint
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: student_groups
            columnNames: student_id, group_id
            constraintName: pk_student_groups

        - addForeignKeyConstraint:
            baseTableName: student_groups
            baseColumnNames: student_id
            constraintName: fk_student_groups_student
            referencedTableName: students
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: student_groups
            baseColumnNames: group_id
            constraintName: fk_student_groups_group
            referencedTableName: groups
            referencedColumnNames: id
            onDelete: CASCADE
