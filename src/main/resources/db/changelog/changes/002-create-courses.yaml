databaseChangeLog:
  - changeSet:
      id: 2-create-courses
      author: voldemar
      changes:
        - createTable:
            tableName: courses
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: teacher_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_teacher_course
                    referencedTableName: teachers
                    referencedColumnName: id
                    onDelete: CASCADE